# This is a basic workflow to help you get started with Actions

name: Integrations Scan

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on:
      - sh_mac_mdn

    env:
      DETECT_PROJECT_NAME: ${{ github.event.repository.name }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Source
        uses: actions/checkout@v4

      #- name: install java
      #  uses: actions/setup-java@v3
      #  with:
      #    distribution: temurin
      #    java-version: 11

      - name: Black Duck Action
        # You may pin to the exact commit or the version.
        uses: blackduck-inc/black-duck-security-scan@v2.4.0
        with:
          bridgecli_download_url: "https://artifactory.tools.duckutil.net/artifactory/clops-local/integrations/bridge/binaries/bridge-cli-bundle/3.9.0rc8/bridge-cli-bundle-3.9.0rc8-macosx.zip"
          blackducksca_token: ${{secrets.BLACKDUCKSCA_TOKEN}}
          blackducksca_url: ${{secrets.BLACKDUCKSCA_URL}}
          blackducksca_prComment_enabled: true
          blackducksca_waitForScan: true
          github_token: ${{secrets.GIT_PAT_TOKEN}}
          blackducksca_fixpr_enabled: true
          blackducksca_reports_sarif_create: true


